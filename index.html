<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Swipe Ring</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(160deg, #8b5cf6 0%, #14b8b8 50%, #ff6b5b 100%);
      color: #fff;
      font: 16px/1.7 -apple-system, "Helvetica Neue", Arial, sans-serif;
      text-align: center;
      padding: 32px 20px;
    }

    h1 {
      font-size: 40px;
      font-weight: 300;
      letter-spacing: 4px;
    }

    p {
      margin: 10px 0 26px;
      opacity: 0.95;
    }

    nav a {
      display: inline-block;
      margin: 6px;
      padding: 10px 22px;
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.92);
      color: #4a2a6b;
      font-weight: 600;
      text-decoration: none;
    }

    .mail {
      margin-top: 24px;
      font-size: 14px;
    }

    .mail a {
      color: #fff;
    }
  </style>
</head>
<body>
  <main>
    <h1>Swipe Ring</h1>
    <p>Turn the board, let the candy rings slip, drop them all into the fountain.</p>
    <nav>
      <a href="privacy/">Privacy Policy</a>
      <a href="terms/">Terms of Use</a>
    </nav>
    <div class="mail">Contact: <a href="mailto:camisang94@icloud.com">camisang94@icloud.com</a></div>
  </main>
</body>
</html>
